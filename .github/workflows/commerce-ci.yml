name: Commerce CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/dylan-palace-commerce-overhaul]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:run
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium > /tmp/playwright-install.log 2>&1
      - name: Responsive browser tests
        id: browser_tests
        continue-on-error: true
        shell: bash
        run: npm run test:e2e -- --project=mobile --project=tablet --project=desktop --reporter=line > playwright-output.txt 2>&1
      - name: Upload browser test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output
          path: playwright-output.txt
          retention-days: 3
      - name: Enforce browser test result
        if: steps.browser_tests.outcome == 'failure'
        run: exit 1
